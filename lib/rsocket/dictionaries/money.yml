# Признаки того, в чём передаётся сумма.
#
# Ошибка в единицах суммы — самая дорогая ошибка подключения: перевод уходит в
# сто раз больше или меньше, и узнают об этом не тесты, а бухгалтерия. Поэтому
# вывод делается по совокупности признаков и всегда попадает в файл догадок с
# обоснованием.

# Слова, прямо называющие минимальные единицы (копейки, центы).
minor_words:
  [копейк, копеек, копейках, kopeck, kopek, cent, minor unit, smallest unit, minimal unit,
   минимальных единиц, минимальной единиц, наименьших единиц, subunit, base unit]

# Слова, прямо называющие основные единицы (рубли, доллары, дробное число).
decimal_words:
  [основных единиц, основной единиц, major unit, whole unit, рубл, доллар, евро, decimal,
   дробн, fractional, units of currency]

# Числовые признаки: целое поле с крупным минимумом или крупным примером — почти
# наверняка минимальные единицы. Границы подобраны так, чтобы обычная сумма
# перевода в рублях (тысячи) не попадала под них, а та же сумма в копейках —
# попадала.
integer_minimum_hint: 1000
integer_example_hint: 10000
