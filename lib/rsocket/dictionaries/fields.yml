# Смысл полей запроса и ответа: как называют одно и то же в разных описаниях.
#
# Признак «по форме запроса и ответа» — главный: он работает там, где имена
# операций бесполезны. Но искать поле по точному имени нельзя, потому что сумма
# бывает и amount, и sum, и value. Поэтому имена полей тоже данные, а не код.
#
# Ключ — смысл, значения — как этот смысл называют. Сравнение идёт по словам
# имени поля, а не по всей строке: merchant_reference распадается на merchant и
# reference, sum.value — на sum и value.

amount: [amount, sum, value, total, price, sum_value, summa, сумма, сумму]
currency: [currency, ccy, cur, валюта]
recipient:
  [recipient, payee, destination, beneficiary, receiver, target, credit_to, payout_requisite,
   card, card_number, card_token, account, iban, phone, получател, реквизит]
# «no» в кавычках намеренно: без них YAML прочитает это слово как «нет».
identifier: [id, uuid, number, "no", key, ref, reference, идентификатор, номер]
status: [status, state, stage, condition, result, статус, состояни]
event: [event, type, action, topic, notification_type, событи]
# Ссылка мерчанта на свою операцию: приходит от нас, а не от провайдера.
merchant_reference:
  [external_id, merchant_reference, order_no, order_id, client_reference, external_reference,
   idempotency_key, request_id]
# Ссылка на ранее созданный ресурс провайдера: по ней узнаётся возврат.
source_reference:
  [payout_id, transfer_id, transfer_no, transaction_id, operation_id, original_id, parent_id,
   payment_id, source_id]
# Код ошибки провайдера: по нему уточняется класс ошибки.
error_code: [code, error_code, errorcode, error, failure, reason, decline_code]
reason: [reason, comment, purpose, message, description, note, причина, назначение]
balance: [balance, available, funds, hold, reserved, остаток, баланс]
signature: [signature, sign, hmac, digest, checksum, подпись]
timestamp: [created_at, updated_at, completed_at, registered_at, finished_at, timestamp, time]
