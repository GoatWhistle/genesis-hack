# Как провайдеры подписывают уведомления.
#
# Способ подписи почти никогда не описан структурой: он лежит текстом в
# описании операции или заголовка. Поэтому здесь слова, по которым мы узнаём
# алгоритм, а всё, чего в списке нет, честно помечается как «не определён» —
# проверять подпись наугад опаснее, чем не проверять вовсе.

algorithms:
  hmac_sha256: [hmac-sha256, hmac_sha256, "hmac sha256", hmacsha256, sha256, sha-256]
  hmac_sha512: [hmac-sha512, hmac_sha512, "hmac sha512", sha512, sha-512]
  rsa_sha256: [rsa-sha256, "rsa sha256", rsa_sha256]

# Как записан результат подписи: от этого зависит сравнение в готовом коде.
encodings:
  hex: [hex, шестнадцатер, hexadecimal]
  base64: [base64, "base 64"]
