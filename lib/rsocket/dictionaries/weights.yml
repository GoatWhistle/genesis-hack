# Вес каждого признака и пороги вердикта.
#
# Оценка роли — сумма весов сработавших признаков. Веса лежат здесь, а не в
# коде, чтобы подкручивать их по итогам прогонов на реальных описаниях, не
# трогая логику. Числа — не вероятности: это цена признака в общей сумме.

lexicon:
  # Имя операции придумано человеком осознанно, поэтому стоит дороже адреса, а
  # тег — дешевле всего: тегами часто называют раздел документации целиком.
  strong:
    operation_id: 2.0
    path: 1.5
    text: 1.0
    tag: 0.5
  weak:
    operation_id: 0.6
    path: 0.5
    text: 0.3
    tag: 0.2

signature:
  money_and_recipient_in_body: 2.5
  identifier_in_path_status_in_response: 2.0
  empty_body_on_subresource: 2.0
  money_with_source_reference: 2.5
  balance_in_response: 2.5
  open_method_with_event_and_status: 3.0

lifecycle:
  issues_identifier: 2.0
  consumes_identifier: 1.5
  reads_without_body: 1.0

thresholds:
  # Выше верхнего — «уверены», между порогами — «требует подтверждения», ниже
  # нижнего — «не определено». Ниже нижнего инструмент не угадывает.
  confident: 5.0
  needs_confirmation: 2.0
  # Уверенный вердикт не выдаётся по одному сигналу, каким бы сильным он ни
  # был: совпадение слов без подтверждения формой запроса — это совпадение слов.
  min_signals_for_confident: 2
