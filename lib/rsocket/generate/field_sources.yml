# Синонимы имён полей: как поле в теле запроса провайдера связывается с полем
# операции у заказчика.
#
# Это знание, а не логика, поэтому оно лежит данными и правится без изменения
# кода. Механизм сопоставления живёт в field_matcher.rb и от содержимого этого
# файла не зависит: добавление синонима новую ветку в коде не требует.
#
# Имена сравниваются в нормализованном виде — `orderNo`, `order_no` и
# `OrderNO` для нас одно и то же слово.
#
# Почему файл лежит здесь, а не в dictionaries/: тот каталог ведёт другой
# участник, и его словари описывают роли операций, статусы и ошибки. Здесь же
# знание про поля тела запроса, которое нужно только генератору. Когда
# появится общий загрузчик словарей, файл переедет туда без правок в коде.

# Сумма выплаты. Берётся из operation.amount, единицы определяет
# классификатор: минорные единицы домножаются, дробные уходят как есть.
amount:
  - amount
  - sum
  - value
  - total
  - price
  - transfer_amount
  - payment_amount
  - payout_amount

# Валюта. Берётся из operation.currency.
currency:
  - currency
  - ccy
  - currency_code
  - iso_currency

# Идентификатор операции на нашей стороне. Берётся из operation.id и служит
# провайдеру ключом для сопоставления и защиты от дублей.
external_id:
  - external_id
  - merchant_reference
  - merchant_order_id
  - client_reference
  - external_reference
  - reference
  - order_no
  - order_id

# Объект получателя. Его вложенные поля заполняются из
# operation.payout_requisite по их собственным именам.
recipient:
  - recipient
  - destination
  - payee
  - beneficiary
  - receiver
  - credit_party
  - counterparty

# Идентификатор операции на стороне провайдера: его возвращает создание
# выплаты и его же принимает запрос статуса.
provider_id:
  - id
  - transfer_id
  - transfer_no
  - payout_id
  - payment_id
  - operation_id
  - transaction_id
  - reference_id

# Поле с кодом ошибки в ответе провайдера. Ищется только в ответах 4xx и 5xx,
# поэтому короткое `code` здесь не двусмысленно.
error_code:
  - code
  - error_code
  - error
  - reason
  - error_reason
  - failure_reason

# Поле со статусом операции в ответе провайдера.
status:
  - status
  - state
  - transfer_status
  - payment_status
  - operation_state
