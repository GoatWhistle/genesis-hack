openapi: 3.0.3
info:
  title: QuantumPay Disbursement API
  version: 1.0.0
  description: |
    Описание для замера, не для сборки. Провайдер называет ровно те же четыре
    операции словами, которых нет в app/config/rules/base.yml: не create, а
    enqueue; не cancel, не revoke и не abort, а halt; не webhook и не callback,
    а signal. Русских описаний тут нет вовсе — только английские, и в них тоже
    ни одного слова из словаря.

    Проверяется этим одно: что будет, когда провайдер напишет непредусмотренным
    словом. Правила такое описание разбирать не обязаны — они и не обещали
    большего, чем перечислено в словаре. Смысловые классификаторы обещали.
  contact:
    name: QuantumPay Integrations
    email: integrations@quantumpay.example

servers:
  - url: https://api.quantumpay.example/v1

security:
  - MerchantToken: []

tags:
  - name: Disbursements
    description: Outbound money movement
  - name: Hooks
    description: Inbound notifications

paths:
  /disbursements:
    post:
      tags: [Disbursements]
      summary: Queue a disbursement for execution
      description: |
        Places a disbursement into the execution queue. The response carries the
        reference used by every other endpoint.
      operationId: enqueueDisbursement
      parameters:
        - name: X-Request-Reference
          in: header
          required: true
          description: Merchant-side unique reference, replayed on retries
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisbursementRequest'
            example:
              merchant_reference: "ord-5512"
              minor_units: 249000
              currency: RUB
              beneficiary:
                account: "40817810000009876543"
                full_name: "Иван Соколов"
                bank_bic: "044525974"
      responses:
        '201':
          description: Queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disbursement'
              example:
                reference: "dsb_7HQ2LMX"
                merchant_reference: "ord-5512"
                minor_units: 249000
                currency: RUB
                phase: queued
        '400':
          description: Malformed body
        '401':
          description: Token rejected
        '422':
          description: Beneficiary details refused

  /disbursements/{reference}:
    get:
      tags: [Disbursements]
      summary: Where a queued disbursement stands right now
      operationId: disbursementSnapshot
      parameters:
        - $ref: '#/components/parameters/Reference'
      responses:
        '200':
          description: Current phase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disbursement'
              example:
                reference: "dsb_7HQ2LMX"
                merchant_reference: "ord-5512"
                minor_units: 249000
                currency: RUB
                phase: settled
        '404':
          description: Unknown reference

  /disbursements/{reference}/halt:
    post:
      tags: [Disbursements]
      summary: Stop a disbursement before it reaches the bank
      description: |
        Works only while the disbursement is still queued. Once handed over to
        the bank the call is refused.
      operationId: haltDisbursement
      parameters:
        - $ref: '#/components/parameters/Reference'
      responses:
        '200':
          description: Stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disbursement'
              example:
                reference: "dsb_7HQ2LMX"
                phase: halted
        '409':
          description: Already handed to the bank

  /hooks/disbursement:
    post:
      tags: [Hooks]
      summary: Message we push to you when a disbursement changes phase
      description: |
        Implement this endpoint on your side. We sign the body and repeat the
        delivery until you answer 200.
      operationId: disbursementSignal
      parameters:
        - name: X-QP-Digest
          in: header
          required: true
          description: HMAC-SHA256 of the raw body
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Signal'
            example:
              reference: "dsb_7HQ2LMX"
              phase: settled
              occurred_at: "2026-02-11T09:14:22Z"
      responses:
        '200':
          description: Accepted

  /ledger:
    get:
      tags: [Disbursements]
      summary: Money available for disbursements
      operationId: ledgerSnapshot
      responses:
        '200':
          description: Amounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  available_minor_units:
                    type: integer
                  currency:
                    type: string

components:
  securitySchemes:
    MerchantToken:
      type: apiKey
      in: header
      name: X-Merchant-Token

  parameters:
    Reference:
      name: reference
      in: path
      required: true
      description: Disbursement reference issued at queue time
      schema:
        type: string

  schemas:
    DisbursementRequest:
      type: object
      required: [merchant_reference, minor_units, currency, beneficiary]
      properties:
        merchant_reference:
          type: string
          description: Your own identifier
        minor_units:
          type: integer
          description: Amount in minor units, 249000 means 2490.00 RUB
          minimum: 10000
          maximum: 60000000
        currency:
          type: string
          enum: [RUB]
        beneficiary:
          $ref: '#/components/schemas/Beneficiary'

    Beneficiary:
      type: object
      required: [account, full_name, bank_bic]
      properties:
        account:
          type: string
        full_name:
          type: string
        bank_bic:
          type: string

    Disbursement:
      type: object
      properties:
        reference:
          type: string
        merchant_reference:
          type: string
        minor_units:
          type: integer
        currency:
          type: string
        phase:
          type: string
          enum: [queued, handed_over, settled, halted, refused]

    Signal:
      type: object
      properties:
        reference:
          type: string
        phase:
          type: string
          enum: [queued, handed_over, settled, halted, refused]
        occurred_at:
          type: string
          format: date-time
