x-s3: &s3
  RSOCKET_S3_ENDPOINT: http://minio:9000
  RSOCKET_S3_BUCKET: rsocket
  RSOCKET_S3_ACCESS_KEY_ID: rsocket
  RSOCKET_S3_SECRET_ACCESS_KEY: rsocket-secret
  RSOCKET_S3_REGION: us-east-1

services:
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: rsocket
      MINIO_ROOT_PASSWORD: rsocket-secret
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  rules:
    build: ../..
    image: genesis-rsocket:latest
    command: bundle exec bin/rsocket push
    environment:
      <<: *s3
    volumes:
      - ../../app/config/rules:/app/app/config/rules:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  rsocket:
    build: ../..
    image: genesis-rsocket:latest
    environment:
      <<: *s3
      RSOCKET_STORAGE: s3
      RSOCKET_CONTRACT: space_payments
    volumes:
      - ../../app/config/rules:/app/app/config/rules:ro
    depends_on:
      minio:
        condition: service_healthy
      rules:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9292/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ${SITE_ROOT:-/srv/genesis}:/srv/genesis:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      rsocket:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      default: {}
      edge:
        aliases: [genesis-web]

networks:
  edge:
    external: true
    name: timeline_timeline

volumes:
  minio:
