# Прод: их compose.yaml целиком, плюс наша статика.
#
# include, а не копия: minio, rules и rsocket описаны в корневом compose.yaml
# командой, и дублировать их здесь значит однажды разойтись с оригиналом.
#
# Запуск с VPS (обязательно из корня репозитория, чтобы имя проекта и пути
# сборки совпадали с корневым compose.yaml):
#
#   docker compose -p rsocket -f web/infra/compose.prod.yaml up -d
#
# Монтируется КАТАЛОГ-РОДИТЕЛЬ (SITE_ROOT), а внутри него Caddy читает
# current/ — симлинк на текущий выпуск. Так сделано не для красоты: bind-том
# в Linux привязан к inode каталога, и если подменять сам каталог со статикой
# (mv site.old site), контейнер продолжит отдавать удалённый старый каталог —
# выкладка проходит «успешно», а сайт не меняется. Симлинк внутри
# смонтированного родителя переключается атомарно и виден контейнеру сразу.
#
# На машине разработчика родителем удобно сделать сам web/:
#
#   SITE_ROOT=./web docker compose -p rsocket -f web/infra/compose.prod.yaml up -d
#
# (тогда current/ — это web/current, симлинк на dist/)

include:
  - ../../compose.yaml

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Обычный bind, а не именованный том с driver_opts: том с device
      # создаётся молча и падает уже при старте контейнера, если каталога нет,
      # причём `docker compose config` этого не показывает. Bind же docker
      # создаёт сам, а промах в пути виден сразу — пустой сайт вместо загадки.
      - ${SITE_ROOT:-/srv/rsocket}:/srv/rsocket:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      rsocket:
        condition: service_healthy
    healthcheck:
      # Внутренняя проверка самого Caddy: конфиг разобран и админ-API живо.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  caddy-data:
  caddy-config:
