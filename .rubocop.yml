plugins:
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  Exclude:
    # Сгенерированный код проверяется отдельным прогоном внутри конвейера,
    # а не общим прогоном по репозиторию.
    - "output/**/*"
    # Примеры описаний API — входные данные, а не наш код.
    - "examples/**/*"
    - "vendor/**/*"

# Проба профиля исполняется в песочнице рядом со сгенерированным классом и
# объявляет имена контракта заказчика: Provider с его BaseService и Probe, которой
# эту пробу зовут. Это материал профиля, такой же как шаблон интерфейса рядом, а
# не файл нашего приложения.
# inherit_mode здесь обязателен: без него наш список заменил бы список по
# умолчанию, а в нём лежат проверки — там несколько заглушек в файле норма.
Style/OneClassPerFile:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - "app/config/rules/contracts/*/probe.rb"

# Rsocket — корень сборки: список файлов в порядке загрузки и фабрики сменных
# частей, соединяющие порты с реализациями. Это перечисление, а не логика, и
# растёт оно ровно на столько, на сколько прибавилось сменных частей. Дробить
# такой список ради метрики — прятать его, а не упрощать.
Metrics/ModuleLength:
  Exclude:
    - "app/boot.rb"

# Классы и модули документируем там, где это что-то объясняет. Формальный
# заголовок над каждым классом ради галочки только зашумляет файл.
Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 100

# Двойные кавычки везде. Причина не в красоте: в проекте много строк с
# интерполяцией и с кириллицей, и правило «одинарные, пока не понадобятся
# двойные» заставляет менять кавычки при каждой правке строки. Единый вид
# убирает эту возню и совпадает с тем, как уже написан весь код в lib/.
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Названия проверок читает человек, и читает он их по-русски. Правило само по
# себе полезное — контекст должен называть условие, а не предмет, — поэтому не
# выключаем его, а перечисляем те же предлоги на нашем языке.
RSpec/ContextWording:
  Prefixes:
    - когда
    - с
    - со
    - без
    - на

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

# Модели собираются именованными аргументами, и их там по семь-восемь. Правило
# полезно против длинных позиционных списков, где на месте вызова не видно, что
# куда встало; с именованными аргументами это видно. Считаем только позиционные.
Metrics/ParameterLists:
  CountKeywordArgs: false

# Проверка сгенерированного сервиса устроена иначе, чем обычный юнит-тест: класса
# на момент загрузки файла ещё нет — он появляется после прогона генератора,
# поэтому describe получает строку, а сборка клиента вынесена в before(:all).
# Гонять java на каждый пример — минута вместо секунды.
RSpec/DescribeClass:
  Exclude:
    - "spec/integration/**/*"

RSpec/BeforeAfterAll:
  Exclude:
    - "spec/integration/**/*"
